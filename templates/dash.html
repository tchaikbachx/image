<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
  <title>Tchaikbachx | Inventory</title>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/static/script/app.js"></script>
</head>

<body x-data="inventory" data-logged-in="{{ 'true' if session.get('is_staff') else 'false' }}">
  <nav id="mainNav" class="navbar">
    <a href="/" class="nav-link">Home</a>
  </nav>

  <main class="content">
    <header class="dept-banner">
      <h1>Inventory Dashboard</h1>
    </header>

    <div class="dashboard-box">
      <nav class="toolbar-container">
        <div class="search-wrapper">
          <input type="text" placeholder="Search by name, type, make, or model..." x-model="searchQuery">

          <select x-model="filters.type" class="filter-select">
            <option value="">All Types</option>
            <option value="Brass">Brass</option>
            <option value="Woodwind">Woodwind</option>
            <option value="Strings">Strings</option>
            <option value="Percussion">Percussion</option>
          </select>

          <button class="btn-advanced" @click="showAdvancedModal = true">
            ⚙ Advanced
          </button>
        </div>

        <div class="staff-actions-wrapper" x-show="isStaff">
          <button class="btn-add" @click="openAddModal()">Add Instrument</button>
          <button class="btn-edit-mode" :class="{'active': isEditMode}" @click="toggleEditMode()">Edit Mode</button>
          <button class="btn-delete-mode" :class="{'active': isDeleteMode}" @click="toggleDeleteMode()">Delete
            Mode</button>
        </div>
      </nav>

      <div class="dashboard-main-content">
        <div class="scroll-container">
          <div class="instrument-grid">
            <template x-for="entry in filteredInstruments" :key="entry.ID">
              <div class="instrument-card" :class="{ 
                  'mode-edit-active': isEditMode,
                  'mode-delete-active': isDeleteMode,
                  'selected-highlight': selectedInstrument?.ID === entry.ID && !isEditMode && !isDeleteMode
              }" @click="handleCardClick(entry)">

                <div class="card-horizontal-section">
                  <h3 x-text="entry.Name_ID"></h3>
                  <span class="status-badge" :class="entry.Status === 'IN' ? 'status-in' : 'status-out'"
                    x-text="entry.Status"></span>
                </div>

                <div class="card-horizontal-data">
                  <div class="detail-item-inline">
                    <strong>Type:</strong>
                    <span x-text="entry.Type"></span>
                  </div>
                  <div class="detail-item-inline">
                    <strong>Make:</strong>
                    <span x-text="entry.Make"></span>
                  </div>
                  <div class="detail-item-inline">
                    <strong>Model:</strong>
                    <span x-text="entry.Model"></span>
                  </div>
                </div>

                <template x-if="isStaff && isDeleteMode">
                  <button @click.stop="deleteInstrument(entry.ID)" class="btn-delete-small">🞪</button>
                </template>
              </div>
            </template>
          </div>
        </div>

        <div id="details-sidebar" class="details-panel" :class="{ 'active': selectedInstrument }">
          <div id="sidebar-inner-container">
            <div class="header-card">
              <div class="instrument-visual-large">
                <div id="detail-picture-container" style="display:none;"></div>
              </div>
              <div class="header-text-large">
                <h2 x-text="selectedInstrument?.Name_ID || 'Select an Instrument'"></h2>
                <span class="status-indicator-pill"
                  :class="selectedInstrument?.Status === 'IN' ? 'status-in' : 'status-out'"
                  x-text="selectedInstrument?.Status || '---'" x-show="selectedInstrument">
                </span>
                <button class="close-btn" @click="selectedInstrument = null">&times;</button>
              </div>
            </div>

            <div class="sidebar-tabs">
              <button class="tab-btn" :class="{ 'active': currentTab === 'details' }"
                @click="currentTab = 'details'">Details</button>
              <button class="tab-btn" :class="{ 'active': currentTab === 'manage' }"
                @click="currentTab = 'manage'">Manage</button>
              <button class="tab-btn" :class="{ 'active': currentTab === 'history' }"
                @click="currentTab = 'history'; fetchHistory(selectedInstrument.Name_ID)"
                x-show="isStaff">History</button>
            </div>

            <div id="manage-content" class="tab-pane" x-show="currentTab === 'manage'">
              <div class="info-box" style="padding: 24px;">
                <template x-if="selectedInstrument?.Status === 'IN'">
                  <div class="checkout-form">
                    <h3>Instrument Checkout</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">This instrument will be due on: <strong
                        x-text="threeMonthsFromToday"></strong></p>
                    <input type="email" x-model="checkoutEmail" placeholder="student@grinnell.edu" class="edit-input"
                      style="margin-top:10px;">
                    <button class="btn-primary" style="margin-top: 15px; width: 100%;" @click="submitCheckout()">Confirm
                      Checkout</button>
                  </div>
                </template>

                <template x-if="selectedInstrument?.Status === 'OUT'">
                  <div class="checkin-section">
                    <p>This item is currently checked out.</p>
                    <button class="btn-secondary" style="width: 100%;" @click="returnInstrument()">Mark as
                      Returned</button>
                  </div>
                </template>
              </div>
            </div>

            <div id="history-content" class="tab-pane" x-show="currentTab === 'history'">
              <div style="padding: 24px;">
                <h3>Borrower History</h3>
                <div class="history-list" style="margin-top: 15px;">
                  <template x-if="instrumentHistory.length === 0">
                    <p style="color: var(--text-muted);">No recorded history.</p>
                  </template>
                  <template x-for="log in instrumentHistory">
                    <div
                      style="padding: 12px; border-bottom: 1px solid var(--border); background: #fdfdfd; border-radius: 4px; margin-bottom: 8px;">
                      <div style="font-weight: 600;" x-text="log.Email"></div>
                      <div style="font-size: 0.8rem; color: var(--text-muted);"
                        x-text="'Checked out: ' + log.Checkout_Date"></div>
                      <div style="font-size: 0.8rem; color: var(--text-muted);" x-text="'Due: ' + log.Due_Date"></div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <div id="details-content" class="tab-pane" :class="{ 'active': currentTab === 'details' }"
              x-show="currentTab === 'details'">
              <div class="details-grid">
                <div class="detail-item">
                  <strong>Type</strong>
                  <span x-show="!isEditMode" x-text="selectedInstrument?.Type || '---'"></span>
                  <input x-show="isEditMode" type="text" x-model="selectedInstrument.Type" class="edit-input">
                </div>

                <div class="detail-item">
                  <strong>Make</strong>
                  <span x-show="!isEditMode" x-text="selectedInstrument?.Make || '---'"></span>
                  <input x-show="isEditMode" type="text" x-model="selectedInstrument.Make" class="edit-input">
                </div>

                <div class="detail-item">
                  <strong>Model</strong>
                  <span x-show="!isEditMode" x-text="selectedInstrument?.Model || '---'"></span>
                  <input x-show="isEditMode" type="text" x-model="selectedInstrument.Model" class="edit-input">
                </div>

                <div class="detail-item">
                  <strong>Serial #</strong>
                  <span x-show="!isEditMode" x-text="selectedInstrument?.Serial_Number || '---'"></span>
                  <input x-show="isEditMode" type="text" x-model="selectedInstrument.Serial_Number" class="edit-input">
                </div>
              </div>

              <div x-show="isStaff" class="staff-only-section">
                <div class="detail-item">
                  <strong>Location</strong>
                  <span x-show="!isEditMode" x-text="selectedInstrument?.Stored_In || '---'"></span>
                  <input x-show="isEditMode" type="text" x-model="selectedInstrument.Stored_In" class="edit-input">
                </div>

                <button class="btn-primary" @click="updateInstrument()">Confirm</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal" :class="{ 'active': showAddModal }" x-show="showAddModal" x-cloak>
    <div class="modal-content">
      <h2>Add New Instrument</h2>
      <div class="details-grid">
        <input type="text" placeholder="Name/ID" x-model="newInstrument.Name_ID">
        <input type="text" placeholder="Type" x-model="newInstrument.Type">
        <input type="text" placeholder="Make" x-model="newInstrument.Make">
        <input type="text" placeholder="Model" x-model="newInstrument.Model">
        <input type="text" placeholder="Serial #" x-model="newInstrument.Serial_Number">
        <input type="text" placeholder="Location" x-model="newInstrument.Stored_In">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" @click="showAddModal = false">Cancel</button>
        <button class="btn-primary" @click="addInstrument()">Confirm</button>
      </div>
    </div>
  </div>

  <div class="modal" :class="{ 'active': showEditModal }" x-show="showEditModal" x-cloak>
    <div class="modal-content">
      <h2>Update Instrument <span x-text="editTarget.Name_ID"></span></h2>
      <div class="details-grid">
        <div class="detail-item"><strong>Type</strong><input type="text" x-model="editTarget.Type"></div>
        <div class="detail-item"><strong>Make</strong><input type="text" x-model="editTarget.Make"></div>
        <div class="detail-item"><strong>Model</strong><input type="text" x-model="editTarget.Model"></div>
        <div class="detail-item"><strong>Serial #</strong><input type="text" x-model="editTarget.Serial_Number"></div>
        <div class="detail-item"><strong>Location</strong><input type="text" x-model="editTarget.Stored_In"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" @click="showEditModal = false">Cancel</button>
        <button class="btn-primary" @click="updateInstrument()">Confirm</button>
      </div>
    </div>
  </div>

  <div class="modal" :class="{ 'active': showAdvancedModal }" x-show="showAdvancedModal" x-cloak>
    <div class="modal-content" style="width: 700px; max-height: 90vh; overflow-y: auto;">
      <button class="close-btn" @click="showAdvancedModal = false">&times;</button>
      <h2>Advanced Search</h2>

      <div class="details-grid">
        <div class="detail-item">
          <label>Name ID</label>
          <input type="text" x-model="filters.Name_ID" placeholder="e.g. TR-01">
        </div>
        <div class="detail-item">
          <label>Old ID</label>
          <input type="text" x-model="filters.Old_ID">
        </div>

        <div class="detail-item">
          <label>Type</label>
          <select x-model="filters.Type">
            <option value="">All Types</option>
            <option value="Brass">Brass</option>
            <option value="Strings">Strings</option>
            <option value="Woodwind">Woodwind</option>
          </select>
        </div>
        <div class="detail-item">
          <label>Grade</label>
          <select x-model="filters.Grade">
            <option value="">Any Grade</option>
            <option value="A">Grade A</option>
            <option value="B">Grade B</option>
            <option value="C">Grade C</option>
          </select>
        </div>

        <div class="detail-item">
          <label>Make</label>
          <input type="text" x-model="filters.Make">
        </div>
        <div class="detail-item">
          <label>Model</label>
          <input type="text" x-model="filters.Model">
        </div>
        <div class="detail-item">
          <label>Serial Number</label>
          <input type="text" x-model="filters.Serial_Number">
        </div>

        <div class="detail-item" style="grid-column: span 2;">
          <label>Max Price: $<span x-text="filters.Price"></span></label>
          <input type="range" min="0" max="9999" step="100" x-model="filters.Price" style="width: 100%;">
        </div>

        <div class="detail-item">
          <label>Storage Location (ID)</label>
          <input type="number" x-model="filters.Stored_In">
        </div>
        <div class="detail-item">
          <label>Department (ID)</label>
          <input type="number" x-model="filters.Dept">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" @click="clearFilters()">Reset All</button>
        <button class="btn-primary" @click="showAdvancedModal = false">Show Results</button>
      </div>
    </div>
  </div>
  </div>
</body>

</html>
